backend:
  name: git-gateway
  branch: main

media_folder: "images/bitacora"
public_folder: "/images/bitacora"

collections:
  - name: "bitacora"
    label: "Bitácora de Campo"
    folder: "content/bitacora"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título del Reporte / Obra", name: "title", widget: "string" }
      - { label: "Proyecto", name: "project", widget: "string", default: "Guillermo Prieto 103" }
      - { label: "Fecha de Publicación", name: "date", widget: "datetime" }
      - { label: "Imagen de Portada", name: "thumbnail", widget: "image" }
      - { label: "Galería de Fotos de Campo", name: "gallery", widget: "list", field: { label: "Fotografía", name: "image", widget: "image" } }
      - { label: "Memoria / Notas Técnicas", name: "body", widget: "markdown" }